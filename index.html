<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Task Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Daily focus</p>
          <h1>Daily Task Tracker</h1>
        </div>

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
          aria-pressed="false"
        >
          <span class="toggle-track" aria-hidden="true">
            <span class="toggle-thumb"></span>
          </span>
          <span id="theme-label" class="toggle-label">Dark mode</span>
        </button>
      </header>

      <main class="app-card">
        <form id="task-form" class="task-form" autocomplete="off">
          <label class="sr-only" for="task-input">Add a new task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="120"
            placeholder="Add a task for today"
          />
          <button type="submit">Add Task</button>
        </form>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
